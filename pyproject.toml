[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "formseal-embed"
version = "3.7.0"
description = "Client-side form encryption that encrypts submissions before they leave the browser and works with any POST endpoint."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = ["pynacl"]
authors = [
    {name = "grayguava"}
]

[project.urls]
Homepage = "https://github.com/useFormseal/formseal-embed"
Repository = "https://github.com/useFormseal/formseal-embed"

[project.scripts]
fse = "fse.fse:main"

[tool.setuptools]
packages = [
    "fse",
    "fse.cli",
    "fse.cli.commands",
    "fse.cli.commands.general",
    "fse.cli.general",
    "fse.cli.ui",
]

[tool.setuptools.package-data]
fse = ["src/**"]